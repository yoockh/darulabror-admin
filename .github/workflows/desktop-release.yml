name: Desktop Release (Electron)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Set build-time env
        env:
          API_BASE_VAR: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          API_BASE_SECRET: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        shell: bash
        run: |
          API_BASE="$API_BASE_VAR"
          if [ -z "$API_BASE" ]; then API_BASE="$API_BASE_SECRET"; fi
          if [ -z "$API_BASE" ]; then
            echo "Missing NEXT_PUBLIC_API_BASE_URL. Set it in Repo Variables (recommended) or Secrets."
            exit 1
          fi
          echo "NEXT_PUBLIC_API_BASE_URL=$API_BASE" >> "$GITHUB_ENV"

      - name: Generate desktop icons
        run: npm run desktop:icons

      - name: Build Next.js
        run: npm run build

      - name: Build & publish desktop artifacts
        env:
          # electron-builder reads GH_TOKEN for GitHub Releases publishing
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx electron-builder --linux --publish always
          else
            npx electron-builder --win --publish always
          fi
